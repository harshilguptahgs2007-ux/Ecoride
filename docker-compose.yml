version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zapbus_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-aws_production_secret_key_change_me}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///database.db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      - redis
    volumes:
      - backend_data:/app

  redis:
    image: redis:7-alpine
    container_name: zapbus_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  backend_data:
  redis_data:
